<!DOCTYPE html>
<html lang="en" data-theme="lab" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Science Classroom — a local, offline classroom display board for primary school teachers.">
<meta name="color-scheme" content="dark light">
<title>Science Classroom — Classroom Display</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 6l8 5v10l-8 5-8-5V11z' fill='none' stroke='%237ee0c8' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%237ee0c8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/themes.css">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/widgets.css">
</head>
<body>
<a class="skip-link" href="#board">Skip to classroom board</a>

<div id="app" class="app">
  <!-- Corners, not a bar: the board gets the whole window. -->
  <header class="topbar" id="topbar">
    <div class="topbar__group topbar__group--start">
      <button type="button" class="cornerbtn" id="btnLibrary" aria-haspopup="dialog" title="Library — decks, templates, recently deleted">
        <span class="btn__icon" data-icon="folder" aria-hidden="true"></span><span class="btn__text">Library</span>
      </button>
    </div>

    <div class="topbar__group topbar__group--end">
      <label class="classpicker" title="Active class">
        <span class="classpicker__label">Class</span>
        <select class="classpicker__select" id="classSelect"></select>
      </label>
      <button type="button" class="cornerbtn" id="btnPresent" title="Presentation mode (full screen)">
        <span class="btn__icon" data-icon="expand" aria-hidden="true"></span><span class="btn__text">Presentation Mode</span>
      </button>
      <button type="button" class="cornerbtn" id="btnSettings" aria-haspopup="dialog" title="Settings">
        <span class="btn__icon" data-icon="sliders" aria-hidden="true"></span><span class="btn__text">Settings</span>
      </button>
    </div>
  </header>

  <main id="board" class="board" tabindex="-1">
    <div class="canvas" id="canvas" aria-label="Classroom board"></div>
    <div class="board__empty" id="boardEmpty" hidden>
      <h1 class="board__empty-title">Add a classroom tool to get started.</h1>
      <p class="board__empty-text">Pick a tool from the bar below, or a ready-made screen from the Library.</p>
    </div>
  </main>

  <footer class="launcher" id="launcher">
    <div class="launcher__lead">
      <button type="button" class="dockbtn" id="btnAnnotate" aria-pressed="false" title="Draw on the board">
        <span data-icon="annotate" aria-hidden="true"></span><span class="btn__text">Annotate</span>
      </button>
    </div>
    <button type="button" class="tile" id="btnBackground" aria-haspopup="dialog" title="Background">
      <span class="tile__icon" data-icon="background" aria-hidden="true"></span>
      <span>Background</span>
    </button>
    <h2 class="launcher__title" id="launcherTitle">Tools</h2>
    <div class="launcher__rail" id="launcherRail" role="group" aria-labelledby="launcherTitle"></div>
    <div class="launcher__end">
      <button type="button" class="dockbtn" id="btnDockToggle" aria-expanded="true" aria-controls="launcherRail" title="Hide the tools">
        <span data-icon="collapse" aria-hidden="true"></span><span class="btn__text">Hide tools</span>
      </button>
    </div>
  </footer>

  <div class="pager" role="group" aria-label="Screens">
    <div class="screenbar">
      <button type="button" class="iconbtn" id="btnScreenPrev" aria-label="Previous screen">‹</button>
      <button type="button" class="screenbar__name" id="btnScreenMenu" aria-haspopup="dialog" title="Screens in this deck">
        <span id="screenName">Screen 1</span>
        <span class="screenbar__count" id="screenCount">1/1</span>
      </button>
      <button type="button" class="iconbtn" id="btnScreenNext" aria-label="Next screen">›</button>
      <button type="button" class="iconbtn" id="btnScreenAdd" aria-label="Add a screen">+</button>
    </div>
    <button type="button" class="iconbtn iconbtn--danger" id="btnResetLayout" aria-label="Clear screen" title="Clear screen">
      <span data-icon="trash" aria-hidden="true"></span>
    </button>
  </div>

  <p class="present-clock" id="presentClock" hidden aria-hidden="true"></p>

  <button type="button" class="corner-exit" id="btnExitPresent" hidden>
    <span aria-hidden="true">✕</span><span class="btn__text">Exit presentation</span>
  </button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" role="status" aria-live="polite"></div>

<noscript>
  <p class="noscript">Science Classroom needs JavaScript enabled in your browser.</p>
</noscript>

<!-- ES modules cannot load from file:// — say so instead of showing a blank page. -->
<script>
  if (window.location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<p class="noscript">Science Classroom needs to be opened through a web address, not from a file on disk.'
        + '<br><br>Run <code>python -m http.server 8000</code> in this folder and open http://localhost:8000,'
        + '<br>or publish the folder to GitHub Pages, Cloudflare Pages or Netlify.</p>';
    });
  }
</script>
<script type="module" src="scripts/main.js"></script>
</body>
</html>
